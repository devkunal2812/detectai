services:
  - type: web
    name: detectai-backend
    env: python
    region: oregon
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # Set in Render dashboard

    healthCheckPath: /health

    autoDeploy: true
